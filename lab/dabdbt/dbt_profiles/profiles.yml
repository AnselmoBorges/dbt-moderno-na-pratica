
# This file defines dbt profiles for deployed dbt jobs.
dabdbt:
  target: local # safe default: no cloud access
  outputs:

    local:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/dabdbt.duckdb') }}"
      schema: main
      threads: 4

    # Ephemeral CI target used to prove --defer against relations from local.
    ci:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/dabdbt.duckdb') }}"
      schema: ci
      threads: 4

    # Doing local development with the dbt CLI?
    # Then you should create your own profile in your .dbt/profiles.yml using 'dbt init'
    # (See README.md)

    # The default target when deployed with the Databricks CLI
    # N.B. when you use dbt from the command line, it uses the profile from .dbt/profiles.yml
    dev:
      type: databricks
      method: http
      catalog: rescue_dev
      schema: rescue

      http_path: "{{ env_var('DBT_DEV_HTTP_PATH') }}"

      connection_parameters:
        verify: false
        connect_timeout: 60

      # The workspace host / token are provided by Databricks
      # see databricks.yml for the workspace host used for 'dev'
      host: "{{ env_var('DBT_HOST', env_var('DATABRICKS_HOST')) }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN', '') or env_var('DATABRICKS_TOKEN', '') }}"
      retry_all: true
      connect_timeout: 60
      threads: 8

    # The production target when deployed with the Databricks CLI
    prd:
      type: databricks
      method: http
      catalog: "{{ env_var('DBT_PROD_CATALOG', 'rescue_prd') }}"
      schema: "{{ env_var('DBT_PROD_SCHEMA', 'rescue') }}"

      http_path: "{{ env_var('DBT_PROD_HTTP_PATH') }}"

      connection_parameters:
        verify: "{{ env_var('DBT_SSL_VERIFY', 'true') }}"

      # The workspace host / token are provided by Databricks
      # see databricks.yml for the workspace host used for 'prod'
      host: "{{ env_var('DBT_HOST') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 8

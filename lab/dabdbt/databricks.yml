# This file defines the structure of this project and how it is deployed
# to production using Databricks Asset Bundles.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabdbt

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  prod_root_path:
    description: Workspace path for production bundle deployment
    default: /Workspace/Shared/data_engineering/.bundle/${bundle.name}/${bundle.target}
  source_olist_env:
    description: Target suffix used by Unity Catalog foreign catalog
    default: ${bundle.target}
  prod_owner_user:
    description: User principal that will retain CAN_MANAGE in production
    default: data-platform@example.invalid
  databricks_host:
    description: Databricks workspace URL; override outside source control
    default: https://example.invalid
  sql_warehouse_id:
    description: Serverless warehouse utilizado pelas tasks dbt
    default: "0000000000000000"

# Deployment targets.
# The default schema, catalog, etc. for dbt are defined in dbt_profiles/profiles.yml
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.databricks_host}

  prd:
    mode: production
    workspace:
      host: ${var.databricks_host}
      root_path: ${var.prod_root_path}
